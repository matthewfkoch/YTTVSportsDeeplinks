name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "README.md"
      - "Dockerfile"
      - ".dockerignore"
      - ".env.example"
      - "chromium-policy.json"
      - "docker-compose.yml"
      - "entrypoint.sh"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "README.md"
      - "Dockerfile"
      - ".dockerignore"
      - ".env.example"
      - "chromium-policy.json"
      - "docker-compose.yml"
      - "entrypoint.sh"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Syntax check
        id: syntax
        run: |
          python -m compileall -q src
          sh -n entrypoint.sh

      - name: JavaScript regression tests
        id: js
        run: node --test tests/js/*.test.cjs

      - name: Tests
        id: tests
        run: pytest -q --junitxml=test-results.xml

      - name: Build Docker image
        id: docker
        run: docker build -t yttvsportsdeeplinks:ci .

      - name: Smoke test Docker image
        id: smoke
        run: |
          docker run -d --name yttv-ci-smoke -e ENABLE_CHROME=0 -p 127.0.0.1:8095:8095 yttvsportsdeeplinks:ci
          trap 'docker rm -f yttv-ci-smoke >/dev/null 2>&1 || true' EXIT
          python3 - <<'PY'
          import json
          import time
          import urllib.request

          deadline = time.monotonic() + 30
          last_error = None
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8095/health", timeout=2) as resp:
                      body = json.loads(resp.read().decode("utf-8"))
                      if resp.status == 200 and body.get("ok") is True:
                          print("Smoke test passed:", body)
                          raise SystemExit(0)
              except Exception as exc:
                  last_error = exc
                  time.sleep(0.5)
          raise SystemExit(f"Container health check failed: {last_error}")
          PY

      - name: Job summary
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            status="✅ Passed"
          else
            status="❌ Failed"
          fi

          if [[ "${{ steps.syntax.outcome }}" == "success" ]]; then
            syntax="✅ Clean"
          elif [[ "${{ steps.syntax.outcome }}" == "skipped" ]]; then
            syntax="⏭️ Skipped"
          else
            syntax="❌ Errors"
          fi

          if [[ "${{ steps.js.outcome }}" == "success" ]]; then
            js_line="✅ Passed"
          elif [[ "${{ steps.js.outcome }}" == "skipped" ]]; then
            js_line="⏭️ Skipped"
          else
            js_line="❌ Failed"
          fi

          if [[ -f test-results.xml ]]; then
            tests="$(grep -oP 'tests="\K[0-9]+' test-results.xml | head -1)"
            failures="$(grep -oP 'failures="\K[0-9]+' test-results.xml | head -1)"
            errors="$(grep -oP 'errors="\K[0-9]+' test-results.xml | head -1)"
            skipped="$(grep -oP 'skipped="\K[0-9]+' test-results.xml | head -1)"
            time="$(grep -oP 'time="\K[0-9.]+' test-results.xml | head -1)"
            tests="${tests:-0}"
            failures="${failures:-0}"
            errors="${errors:-0}"
            skipped="${skipped:-0}"
            test_line="**${tests}** tests — ${failures} failed, ${errors} errors, ${skipped} skipped (${time}s)"
          elif [[ "${{ steps.tests.outcome }}" == "success" ]]; then
            test_line="✅ All tests passed"
          else
            test_line="❌ Tests did not complete"
          fi

          if [[ "${{ steps.docker.outcome }}" == "success" && "${{ steps.smoke.outcome }}" == "success" ]]; then
            docker_line="✅ Image built & healthy"
          elif [[ "${{ steps.docker.outcome }}" == "success" && "${{ steps.smoke.outcome }}" != "success" ]]; then
            docker_line="❌ Smoke test failed"
          elif [[ "${{ steps.docker.outcome }}" == "skipped" ]]; then
            docker_line="⏭️ Skipped"
          else
            docker_line="❌ Build failed"
          fi

          {
            echo "## YTTV Sports Deeplinks CI"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Status** | ${status} |"
            echo "| **Python** | 3.12 |"
            echo "| **Syntax check** | ${syntax} |"
            echo "| **JS tests** | ${js_line} |"
            echo "| **Docker** | ${docker_line} |"
            echo "| **Trigger** | \`${{ github.event_name }}\` on \`${{ github.ref_name }}\` |"
            echo "| **Commit** | [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |"
            echo ""
            echo "**Python tests:** ${test_line}"
          } >> "$GITHUB_STEP_SUMMARY"
