name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  # GHCR requires lowercase image names (repository may be mixed-case).
  IMAGE_NAME: ${{ github.repository_owner }}/yttvsportsdeeplinks

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Tests
        run: pytest -q

  publish-docker:
    name: Publish Docker image
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version tags
        id: meta
        run: |
          image="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/yttvsportsdeeplinks"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            ver="${GITHUB_REF_NAME#v}"
            echo "version=${ver}" >> "$GITHUB_OUTPUT"
            echo "tags=${{ env.REGISTRY }}/${image}:${ver},${{ env.REGISTRY }}/${image}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
            echo "tags=${{ env.REGISTRY }}/${image}:dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Job summary
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            status="✅ Published"
          else
            status="❌ Failed"
          fi

          tags="${{ steps.meta.outputs.tags }}"
          tag_list="$(echo "$tags" | tr ',' '\n' | sed 's/^/- `/' | sed 's/$/`/')"

          {
            echo "## Release — Docker Image"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Status** | ${status} |"
            echo "| **Version** | ${{ steps.meta.outputs.version }} |"
            echo "| **Platforms** | \`linux/amd64\`, \`linux/arm64\` |"
            echo "| **Registry** | \`${{ env.REGISTRY }}\` |"
            echo "| **Repository** | \`${{ steps.meta.outputs.image }}\` |"
            echo "| **Digest** | \`${{ steps.docker.outputs.digest || '—' }}\` |"
            echo "| **Trigger** | \`${{ github.event_name }}\` — \`${{ github.ref_name }}\` |"
            echo ""
            echo "**Tags pushed:**"
            echo "${tag_list:-—}"
            echo ""
            echo "**Pull:**"
            echo "\`\`\`"
            echo "docker pull ${{ env.REGISTRY }}/${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: Publish GitHub Release
    needs: [publish-docker]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/yttvsportsdeeplinks" >> "$GITHUB_OUTPUT"

      - name: Publish release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: YTTV Sports Deeplinks v${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## Docker

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ```

            Or pull `:latest` for the most recent release.

            ```bash
            cp .env.example .env
            docker compose up -d
            ```

            Use `docker compose up -d --build` only when you want to build from local source.

      - name: Job summary
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            status="✅ Published"
          else
            status="❌ Failed"
          fi

          release_url="${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"

          {
            echo "## Release — GitHub Release"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Status** | ${status} |"
            echo "| **Version** | v${{ steps.version.outputs.version }} |"
            echo "| **Release** | [${release_url}](${release_url}) |"
            echo "| **Docker image** | \`${{ env.REGISTRY }}/${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}\` |"
            echo ""
            echo "Release notes: ${release_url}"
          } >> "$GITHUB_STEP_SUMMARY"
